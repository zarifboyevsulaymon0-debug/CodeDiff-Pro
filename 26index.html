<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeDiff Pro - Text & Code Difference Checker</title>
    
    <!-- CSS STYLES -->
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --accent: #a371f7;
            --accent-hover: #8957e5;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --added-bg: rgba(46, 160, 67, 0.15);
            --added-text: #3fb950;
            --removed-bg: rgba(218, 54, 51, 0.15);
            --removed-text: #f85149;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 15px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-dim);
            font-size: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .input-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .input-card label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            outline: none;
            resize: vertical;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .actions {
            text-align: center;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .result-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .result-card h3 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .diff-output {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            overflow-x: auto;
        }

        .diff-line {
            padding: 2px 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-line.added {
            background-color: var(--added-bg);
            color: var(--added-text);
        }

        .diff-line.removed {
            background-color: var(--removed-bg);
            color: var(--removed-text);
        }

        .diff-line.unchanged {
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <header>
        <h1>🔍 CodeDiff Pro</h1>
        <p>Matn va kod parchalarini o'zaro solishtirish hamda farqlarni aniqlash</p>
    </header>

    <div class="container">
        
        <div class="inputs-grid">
            <div class="input-card">
                <label>Original Matn / Kod (Eski variant):</label>
                <textarea id="textOriginal" placeholder="Eski kodingizni yoki matningizni shu yerga kiriting..."></textarea>
            </div>
            <div class="input-card">
                <label>O'zgartirilgan Matn / Kod (Yangi variant):</label>
                <textarea id="textModified" placeholder="Yangi kodingizni yoki matningizni shu yerga kiriting..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button onclick="compareTexts()">Farqlarni Tekshirish ⚡</button>
        </div>

        <div class="result-card" id="resultCard">
            <h3>📊 Solishtirish Natijasi:</h3>
            <div class="diff-output" id="diffOutput"></div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function compareTexts() {
            const original = document.getElementById('textOriginal').value.split('\n');
            const modified = document.getElementById('textModified').value.split('\n');
            const diffOutput = document.getElementById('diffOutput');
            const resultCard = document.getElementById('resultCard');

            diffOutput.innerHTML = '';
            
            const maxLines = Math.max(original.length, modified.length);
            let hasDifference = false;

            for (let i = 0; i < maxLines; i++) {
                const origLine = original[i];
                const modLine = modified[i];

                if (origLine === modLine) {
                    if (origLine !== undefined) {
                        appendLine(`  ${origLine}`, 'unchanged');
                    }
                } else {
                    hasDifference = true;
                    if (origLine !== undefined) {
                        appendLine(`- ${origLine}`, 'removed');
                    }
                    if (modLine !== undefined) {
                        appendLine(`+ ${modLine}`, 'added');
                    }
                }
            }

            if (!hasDifference && original.join('') !== '') {
                diffOutput.innerHTML = '<div style="color: var(--added-text);">✅ Har ikkala matn ham mutlaqo bir xil!</div>';
            }

            resultCard.style.display = 'block';
        }

        function appendLine(text, type) {
            const div = document.createElement('div');
            div.className = `diff-line ${type}`;
            div.textContent = text;
            document.getElementById('diffOutput').appendChild(div);
        }
    </script>
</body>
</html>
